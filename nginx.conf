# ================================================================
# AI 资讯早报 — Nginx 配置（生产环境）
# ================================================================
# 部署步骤：
#   1. 替换 vcast.asia 为实际域名
#   2. 申请 SSL 证书：certbot certonly --standalone -d vcast.asia
#   3. 取消 SSL server 块的注释
#   4. docker compose restart nginx
# ================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;

    # Docker 内置 DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Gzip 压缩 ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ══════════════════════════════════════════════════════════
    # HTTP → HTTPS 跳转（启用 SSL 后取消注释）
    # ══════════════════════════════════════════════════════════
    # server {
    #     listen 80;
    #     server_name vcast.asia;
    #     return 301 https://$host$request_uri;
    # }

    # ══════════════════════════════════════════════════════════
    # HTTPS 主服务（启用 SSL 后取消注释）
    # ══════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name vcast.asia;
    #
    #     ssl_certificate     /etc/letsencrypt/live/vcast.asia/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/vcast.asia/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # 需将 SSL 证书挂载到容器内，在 docker-compose.yml 中取消注释：
    #     #   volumes:
    #     #     - /etc/letsencrypt:/etc/letsencrypt:ro
    #
    #     # ── 复用下方所有 location ──
    #     include /etc/nginx/conf.d/locations.conf;
    # }

    # ══════════════════════════════════════════════════════════
    # HTTP 服务（始终启用，SSL 启用后作为跳转源 / 健康检查）
    # ══════════════════════════════════════════════════════════
    server {
        listen 80;

        # 模块 A — 资讯抓取
        location /run {
            set $upstream_a module-a:8001;
            proxy_pass http://$upstream_a;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 B — AI 内容加工
        location /run-b {
            set $upstream_b module-b:8002;
            proxy_pass http://$upstream_b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 B — 长图输出
        location /longimage/ {
            set $upstream_b module-b:8002;
            proxy_pass http://$upstream_b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 B — 简报预览
        location /preview/ {
            set $upstream_b module-b:8002;
            proxy_pass http://$upstream_b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 C — 微信小程序 + 公众号回调
        location /push {
            set $upstream_c module-c:8003;
            proxy_pass http://$upstream_c;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 C — API（小程序调用）
        location /api/ {
            set $upstream_c module-c:8003;
            proxy_pass http://$upstream_c;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 微信公众号回调（需白名单 IP）
        location /weixin/ {
            set $upstream_c module-c:8003;
            proxy_pass http://$upstream_c;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 D — 多平台发布
        location /publish {
            set $upstream_d module-d:8004;
            proxy_pass http://$upstream_d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 E — Dashboard API
        location /api/dashboard/ {
            set $upstream_e module-e:8005;
            proxy_pass http://$upstream_e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 E — Dashboard 前端页面
        location /dashboard {
            set $upstream_e module-e:8005;
            proxy_pass http://$upstream_e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 E — 调度管理
        location /admin/ {
            set $upstream_e module-e:8005;
            proxy_pass http://$upstream_e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模块 F — 视频生成（仅本地运行，云端忽略）
        location /generate {
            set $upstream_f module-f:8006;
            proxy_pass http://$upstream_f;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /status/ {
            set $upstream_f module-f:8006;
            proxy_pass http://$upstream_f;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /videos {
            set $upstream_f module-f:8006;
            proxy_pass http://$upstream_f;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 各模块健康检查
        location /health/a { set $u module-a:8001; proxy_pass http://$u/health; }
        location /health/b { set $u module-b:8002; proxy_pass http://$u/health; }
        location /health/c { set $u module-c:8003; proxy_pass http://$u/health; }
        location /health/d { set $u module-d:8004; proxy_pass http://$u/health; }
        location /health/e { set $u module-e:8005; proxy_pass http://$u/health; }
        location /health/f { set $u module-f:8006; proxy_pass http://$u/health; }

        # 根路径 — Dashboard 首页
        location / {
            set $upstream_e module-e:8005;
            proxy_pass http://$upstream_e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
